<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPULATRIX HQ - OREXA</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
header{background:#111;padding:20px;text-align:center;border-bottom:2px solid #FFD700}
h1{color:#FFD700;margin:0;font-size:26px}
#status{background:#1a1a1a;color:#FFD700;padding:15px;margin:10px;border-radius:10px;text-align:center;font-weight:bold;border:1px solid #333}
#chat{height:40vh;overflow-y:auto;padding:15px;background:#050505;margin:10px;border-radius:15px;border:1px solid #222;display:flex;flex-direction:column;gap:10px}
.user{align-self:flex-end;background:#FFD700;color:#000;padding:10px 14px;border-radius:18px;max-width:80%;font-weight:bold}
.ai{align-self:flex-start;background:#222;color:#fff;padding:10px 14px;border-radius:18px;max-width:85%;border:1px solid #333}
#controls{padding:10px;max-width:500px;margin:auto}
input{width:70%;padding:14px;border-radius:25px;border:1px solid #333;background:#111;color:#fff}
button{padding:14px 20px;border-radius:25px;border:none;background:#FFD700;color:#000;font-weight:900}
#voiceBtn{width:100%;margin-top:12px;padding:20px;font-size:22px;background:radial-gradient(#FFD700,#FFA500);border-radius:50px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.q{padding:12px;background:#111;border:1px solid #333;border-radius:10px;color:#FFD700;text-align:center;font-weight:bold;font-size:12px}
#log{background:#0a0a0a;margin:10px;padding:12px;border-radius:10px;border:1px solid #222;max-width:500px;margin:auto}
.task{font-size:12px;color:#ccc;padding:5px 0;border-bottom:1px solid #1a1a1a}
</style>
</head>
<body>
<header><h1>OPULATRIX HQ - OREXA</h1><div style="color:#888;font-size:11px">FIXED MODE - NO LOOP - SHE DOES IT</div></header>
<div id="status">OREXA READY. Tap mic and give 1 order.</div>
<div id="chat"><div class="ai">Brother I'm FIXED now. No loop. Say: CRM, PULLMAN, EMAIL, WHATSAPP, CALENDAR - I will OPEN it instantly. Try now.</div></div>
<div id="controls">
<div style="display:flex;gap:8px"><input id="input" placeholder="Type: CRM, Pullman, Email..."><button onclick="handleText()">GO</button></div>
<button id="voiceBtn" onclick="startVoice()">🎙️ TAP TO SPEAK</button>
<div class="grid">
<div class="q" onclick="doJob('CRM')">📊 CRM</div>
<div class="q" onclick="doJob('PULLMAN')">🏨 PULLMAN</div>
<div class="q" onclick="doJob('EMAIL')">📧 EMAIL</div>
<div class="q" onclick="doJob('WHATSAPP')">💬 WHATSAPP</div>
<div class="q" onclick="doJob('CALENDAR')">📅 CALENDAR</div>
<div class="q" onclick="clearLog()">🗑️ CLEAR</div>
</div>
</div>
<div id="log">
