<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box} html,body{margin:0;background:#050507;color:#fff;font-family:monospace;height:100dvh;overflow:hidden}
.wrap{width:392px;max-width:96vw;margin:0 auto;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:10px}
.top,.hero,.card,.payrow,.inputbox{border:1px solid #1E1E20;background:linear-gradient(180deg,#111113,#0A0A0B);border-radius:14px;box-shadow:0 0 0 1px #000 inset}
.top{padding:11px 14px;display:flex;justify-content:space-between;align-items:center}
.gold{color:#E8C15A;font-weight:900}
.hero{padding:12px 14px}
.hero .title{font-size:18px;line-height:.95;letter-spacing:.5px;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{padding:10px 11px;pointer-events:none;user-select:none}
.card b{font-size:11px;display:block;margin-bottom:2px}
.card span{font-size:8.5px;color:#8A8A8E}
.payrow{border-color:#E8C15A;padding:11px 12px;display:flex;justify-content:space-between;align-items:center}
.paybtn{background:#E8C15A;color:#000;text-decoration:none;font-weight:900;font-size:12px;padding:9px 18px;border-radius:10px}
.inputbox{padding:8px;display:flex;gap:8px}
.inputbox input{flex:1;background:#000;border:1px solid #222;border-radius:10px;color:#fff;padding:10px;font-size:11px;outline:none}
.inputbox input:focus{border-color:#E8C15A}
.inputbox button{background:#fff;color:#000;border:0;border-radius:10px;padding:0 16px;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span class="gold" style="font-size:12px">OPULATIX // OREXA</span><span style="background:#E8C15A;color:#000;font-size:7px;padding:4px 8px;border-radius:99px;font-weight:900">OWNER</span></div>

<div class="hero">
<div class="title gold">YOUR PRIVATE<br>SHOP</div>
<div style="font-size:8.5px;color:#777;margin-top:4px">Runs on THIS phone only. 0% server.</div>
</div>

<div class="grid">
<div class="card"><b class="gold">01 AOI</b><span>Private Camera + Scan</span></div>
<div class="card"><b class="gold">02 PROOF</b><span>Hash + Timestamp</span></div>
<div class="card"><b class="gold">03 BATTERY</b><span>Super Build</span></div>
<div class="card"><b class="gold">04 COLLAR</b><span>ID Tracker</span></div>
<div class="card"><b class="gold">05 BOOST</b><span>Antenna + 4G</span></div>
<div class="card"><b class="gold">06 YARD</b><span>Backyard Test</span></div>
</div>

<div class="payrow"><div><b class="gold" style="font-size:11px">07 SHARK TANK</b><div style="font-size:8px;color:#999">Video Proof Drop</div></div><a class="paybtn" href="#">PAY</a></div>

<div class="inputbox"><input id="pp" placeholder="PayPal email"><button onclick="localStorage.setItem('pp',document.getElementById('pp').value);alert('LOCKED')">LOCK</button></div>
</div>
</body>
</html>
