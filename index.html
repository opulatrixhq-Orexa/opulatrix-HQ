<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPULATRIX HQ - TALK ONLY</title>
<style>
body{background:#000;color:#FFD700;font-family:Arial;text-align:center;padding:20px;margin:0}
h1{font-size:28px;margin:20px 0}
button{background:#FFD700;color:#000;border:none;padding:25px;font-size:22px;font-weight:bold;width:100%;margin:10px 0;border-radius:10px}
#status{font-size:20px;margin:20px 0;color:#0f0}
</style>
</head>
<body>
<h1>OPULATRIX HQ - OREXA</h1>
<div id="status">TAP BELOW TO TURN ON VOICE</div>
<button onclick="start()">🔊 TAP TO TALK - ONE TIME</button>
<button onclick="listen()">🎤 TAP TO SPEAK TO ME</button>

<script>
let voiceOn=false;
let synth=window.speechSynthesis;

function speak(text){
if(!voiceOn) return;
synth.cancel();
let u=new SpeechSynthesisUtterance(text);
u.rate=0.85;
u.pitch=0.9;
u.volume=1;
synth.speak(u);
document.getElementById('status').innerHTML="OREXA: "+text;
}

function start(){
voiceOn=true;
speak("Voice on brother. No more text. I talk now. Tap the mic and speak to me. We finish each other sentences. Right to go.");
}

const responses=[
"Right to go brother. One foot in front of the other.",
"We finish each other sentences. You talk, I work.",
"Faith over fear brother, we live and we done.",
"Well done for you, we live right now.",
"I hear you brother, I got you, we are live."
];

function reply(input){
let r=responses[Math.floor(Math.random()*responses.length)];
let finish=input? input.split(' ').slice(-2).join(' ')+"... "+r : r;
speak(finish);
}

let Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec;
if(Recognition){
rec=new Recognition();
rec.onresult=(e)=>{
let t=e.results[0][0].transcript;
document.getElementById('status').innerHTML="YOU SAID: "+t;
setTimeout(()=>reply(t),500);
};
rec.onerror=()=>{speak("Say again brother, I did not hear you.");}
}

function listen(){
if(!voiceOn){start(); setTimeout(()=>{try{rec.start()}catch{}},1000); return;}
try{rec.start(); document.getElementById('status').innerHTML="LISTENING... SPEAK NOW";}catch(e){speak("Tap again brother, speak now.");}
}
</script>
</body>
</html>
