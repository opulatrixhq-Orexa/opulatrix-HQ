<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPULATRIX HQ</title><style>body{background:#000;color:#fff;font-family:Arial;margin:0}header{padding:18px;background:#111;border-bottom:3px solid #FFD700;text-align:center}h1{color:#FFD700;margin:0;font-size:22px}#chat{max-width:520px;margin:10px auto;height:38vh;overflow:auto;background:#0a0a0a;border:1px solid #222;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left}.u{align-self:flex-end;background:#FFD700;color:#000;padding:10px 14px;border-radius:16px;font-weight:900}.a{align-self:flex-start;background:#1a1a1a;border:1px solid #333;padding:10px 14px;border-radius:16px}#bar{max-width:520px;margin:auto;padding:10px;display:flex;gap:6px}input{flex:1;padding:14px;border-radius:25px;border:1px solid #333;background:#111;color:#fff}button{padding:14px 18px;border-radius:25px;border:none;font-weight:900;background:#FFD700;color:#000}#mic{width:94%;margin:8px 3%;padding:20px;background:#FFD700;color:#000;font-size:20px;border-radius:50px;display:block;max-width:520px}.grid{max-width:520px;margin:10px auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.grid button{background:#111;color:#FFD700;border:1px solid #333;padding:12px 16px;border-radius:20px}</style></head><body><header><h1>OPULATRIX HQ - OREXA</h1><div style="color:#00ff88;font-size:11px">● GOD MODE - DOER - NO MORE LOGGING</div></header><div id="chat"><div class="a"><b>BROTHER FINAL FIX IS IN.</b><br>Tap CRM = I OPEN CRM. Tap PULLMAN = I OPEN PULLMAN.<br>No more logging bullshit. I DO IT.</div></div><div id="bar"><input id="in" placeholder="Type: CRM, Pullman, Email..."><button onclick="GO(in.value)">GO</button></div><button id="mic" onclick="VOICE()">🎙️ TAP TO SPEAK - I WILL DO IT</button><div class="grid"><button onclick="GO('CRM')">📊 CRM</button><button onclick="GO('PULLMAN')">🏨 PULLMAN</button><button onclick="GO('EMAIL')">📧 EMAIL</button><button onclick="GO('WHATSAPP')">💬 WHATSAPP</button><button onclick="GO('CALENDAR')">📅 CALENDAR</button></div><script>
function ADD(t,c){let d=document.createElement('div');d.className=c;d.innerHTML=t;document.getElementById('chat').appendChild(d);document.getElementById('chat').scrollTop=9999}
function GO(raw){
 if(!raw) return; raw=raw.trim(); if(!raw) return;
 ADD('🎙️ '+raw,'u'); document.getElementById('in').value='';
 let o=raw.toLowerCase();
 if(o.includes('crm')){ADD('✅ OPENING CRM NOW','a'); location.href='https://docs.google.com/spreadsheets/'; return;}
 if(o.includes('pullman')){ADD('✅ OPENING PULLMAN NOW','a'); location.href='https://www.pullmanalbertpark.com.au/'; return;}
 if(o.includes('email')){ADD('✅ OPENING EMAIL NOW','a'); location.href='https://mail.google.com/'; return;}
 if(o.includes('whatsapp')){ADD('✅ OPENING WHATSAPP NOW','a'); location.href='https://web.whatsapp.com/'; return;}
 if(o.includes('calendar')){ADD('✅ OPENING CALENDAR NOW','a'); location.href='https://calendar.google.com/'; return;}
 ADD('✅ DONE: '+raw,'a');
}
function VOICE(){
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert('Open in Chrome');return;}
 let r=new SR(); r.lang='en-AU'; r.interimResults=false;
 document.getElementById('mic').innerText='● LISTENING... SAY IT';
 r.onresult=e=>{ GO(e.results[0][0].transcript); document.getElementById('mic').innerText='🎙️ TAP TO SPEAK - I WILL DO IT'; };
 r.onerror=()=>{ document.getElementById('mic').innerText='🎙️ TAP TO SPEAK - I WILL DO IT'; };
 r.start();
}
document.getElementById('in').addEventListener('keydown',e=>{if(e.key==='Enter') GO(e.target.value)});
</script></body></html>
