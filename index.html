<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPULATRIX - THE ORACLE</title>

</head>
<body>

   RENDER(); document.getElementById('crmBox').innerHTML = '<b>EMAIL CLEANER CHECKLIST:</b><br>✅ Delete VID/IMG from GitHub repo (you did?)<br>☐ Gmail: search larger:10M delete<br>☐ Gmail: Empty Trash & Spam (saves 5GB)<br>☐ Drive: Delete large files<br>☐ Photos: Empty bin';
   document.getElementById('crmBox').style.display='block';
   return;
 }
 if(o.includes('build')||o.includes('app')||o.includes('oracle')){
