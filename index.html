<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPULATRIX HQ - OREXA</title>
<style>
body{background:#000;color:#FFD700;font-family:Arial;text-align:center;padding:20px;margin:0}
h1{font-size:28px;margin-top:30px;letter-spacing:2px}
#status{color:#fff;font-size:18px;margin:20px;padding:15px;border:1px solid #FFD700;min-height:60px}
button{background:#FFD700;color:#000;border:none;padding:20px 40px;font-size:22px;font-weight:bold;border-radius:50px;cursor:pointer;margin:20px}
button:active{transform:scale(0.95)}
p{color:#aaa;font-size:14px}
</style>
</head>
<body>
<h1>OPULATRIX HQ - OREXA</h1>
<p>Your AI Concierge</p>
<div id="status">Tap 🎙️ and say "Book Pullman Monday"</div>
<button id="btn" onclick="start()">🎙️ GIVE ORDER</button>
<p id="log"></p>

<script>
const statusDiv = document.getElementById('status');
const logDiv = document.getElementById('log');
const synth = window.speechSynthesis;

function speak(text){
  statusDiv.innerText = text;
  let u = new SpeechSynthesisUtterance(text);
  u.rate=1; u.pitch=1;
  synth.speak(u);
}

function start(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    speak("Brother, use Chrome on Android. This browser doesn't support voice.");
    return;
  }
  let rec = new SpeechRecognition();
  rec.lang='en-AU';
  rec.interimResults=false;
  rec.onstart = ()=>{ statusDiv.innerText="Listening... Speak now brother"; logDiv.innerText=""; }
  rec.onresult = (e)=>{
    let order = e.results[0][0].transcript;
    logDiv.innerText="You said: "+order;
    let reply = `Order received. You said ${order}. I'm going off to do it now. I'll report back when it's done.`;
    speak(reply);
  }
  rec.onerror = (e)=>{ statusDiv.innerText="Error: "+e.error+". Tap again."; }
  rec.start();
}
window.onload = ()=>{ speak("OREXA is online brother. Ready for orders."); }
</script>
</body>
</html>
